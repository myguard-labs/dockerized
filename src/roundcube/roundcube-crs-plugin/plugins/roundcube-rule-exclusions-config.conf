# OWASP CRS Plugin
# Plugin name: roundcube-rule-exclusions
# Plugin description: False-positive remediation for Roundcube webmail
# Rule ID block base: 9,508,000 - 9,508,999
# Plugin version: 1.0.0

# Generic rule to disable the plugin
#
# Plugins are enabled by default. They become active by placing them in
# the plugin folder. Activation can be controlled via a variable; the
# predefined name is "<plugin name>-plugin_enabled".
# For the roundcube-rule-exclusions-plugin, this means it can be disabled
# by setting tx.roundcube-rule-exclusions-plugin_enabled=0.
#
# A global setting of this variable overrides the setting here. The
# "enabled" variable is only set by this rule if it has not been set
# before.
#
# SecRule &TX:roundcube-rule-exclusions-plugin_enabled "@eq 0" \
#     "id:9508010,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ver:'roundcube-rule-exclusions-plugin/1.0.0',\
#     setvar:'tx.roundcube-rule-exclusions-plugin_enabled=0'"
