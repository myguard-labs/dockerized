# OWASP CRS Plugin
# Plugin name: roundcube-rule-exclusions
# Plugin description: False-positive remediation for Roundcube webmail
# Rule ID block base: 9,508,000 - 9,508,999
# Plugin version: 1.0.0

# Documentation:
# https://github.com/eilandert/roundcube-crs-plugin
#
# Roundcube is a single-entry app: every request is dispatched through
# index.php with the area selected by the _task argument
# (mail|addressbook|settings|login|logout) and the operation by _action.
# These exclusions are therefore scoped as tightly as possible — by
# _task / _action and by the specific argument that carries user content
# — so the rest of the request is still fully inspected by CRS.
#
# What trips CRS in a normal Roundcube session:
#   * Composing/sending HTML mail: the body legitimately contains
#     <script>, on*= handlers, SQL-looking text, etc. (942/941 rules).
#   * The _token CSRF value and serialized prefs look like SQLi/encoding.
#   * Searching messages/contacts: operators like UNION, OR 1=1 appear in
#     real search strings (942 rules).
#   * managesieve filter scripts: raw Sieve is full of "if/require/stop"
#     and quoted strings that look like injection (941/942/932).
#   * vCard / ICS import uploads: multipart bodies trip 941/942.
#   * Elastic skin AJAX posts large JSON blobs (920 rules on body).

# Generic rule to disable plugin
SecRule TX:roundcube-rule-exclusions-plugin_enabled "@eq 0" \
    "id:9508099,phase:1,pass,nolog,ctl:ruleRemoveById=9508100-9508999"


# =========================================================================
# [ Login ]
# =========================================================================
# The login POST carries _user / _pass which legitimately contain odd
# characters; only relax the password/user fields, keep everything else.
SecRule ARGS:_task "@streq login" \
    "id:9508100,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_pass,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_user,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_token"

# The CSRF token shows up on essentially every authenticated request and
# is a high-entropy string that trips encoding/SQLi byte rules.
SecAction \
    "id:9508110,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=942430;ARGS:_token,\
    ctl:ruleRemoveTargetById=942431;ARGS:_token,\
    ctl:ruleRemoveTargetById=942432;ARGS:_token,\
    ctl:ruleRemoveTargetById=941320;ARGS:_token,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:_token"


# =========================================================================
# [ Mail: compose / send ]  (_task=mail, HTML body + headers)
# =========================================================================
# Sending mail: _message (body), _subject, recipient lists, and the
# pasted/replied HTML body all legitimately contain script-like and
# SQL-like content. Relax the body + header fields ONLY for the send
# action; everything else stays inspected.
SecRule ARGS:_task "@streq mail" \
    "id:9508200,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule ARGS:_action "@rx ^(send|compose|save\.draft)$" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_message,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_subject,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_to,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_cc,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_bcc,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_replyto,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_followupto,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_from"

# HTML mail bodies in the body of the request (multipart) trip the 941
# XSS family and 920 protocol rules. Drop those two families for the
# mail compose/send body specifically.
SecRule ARGS:_task "@streq mail" \
    "id:9508210,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule ARGS:_action "@rx ^(send|save\.draft)$" \
        "t:none,\
        ctl:ruleRemoveByTag=attack-xss,\
        ctl:ruleRemoveByTag=attack-protocol"


# =========================================================================
# [ Mail: search ]
# =========================================================================
# IMAP search strings legitimately contain SQL keywords and operators.
SecRule ARGS:_task "@streq mail" \
    "id:9508220,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule ARGS:_action "@rx ^(search|list)$" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:_q,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:_search,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:_search_mods,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:_q"


# =========================================================================
# [ Addressbook: search / import / save (vCard) ]
# =========================================================================
SecRule ARGS:_task "@streq addressbook" \
    "id:9508300,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:_q,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:_search,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_notes,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_name,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_displayname"

# vCard import is a multipart file upload full of quoted strings.
SecRule ARGS:_task "@streq addressbook" \
    "id:9508310,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule ARGS:_action "@streq import" \
        "t:none,\
        ctl:ruleRemoveByTag=attack-protocol,\
        ctl:ruleRemoveByTag=attack-injection-php"


# =========================================================================
# [ Settings: identities / managesieve filters ]
# =========================================================================
# Identity signatures are HTML; relax XSS/protocol on the signature field.
SecRule ARGS:_task "@streq settings" \
    "id:9508400,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:_signature,\
    ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:_signature,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_signature"

# managesieve: the raw Sieve script (_raw / _script) is a whole DSL and
# trips SQLi/RCE/protocol heuristics. Relax those families for the sieve
# save/upload actions only.
SecRule ARGS:_task "@streq settings" \
    "id:9508410,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule ARGS:_action "@rx ^plugin\.managesieve(-action)?$" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:_raw,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:_script,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:_raw,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:_script,\
        ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:_raw,\
        ctl:ruleRemoveTargetByTag=attack-protocol;ARGS:_script"


# =========================================================================
# [ Elastic skin AJAX / large request bodies ]
# =========================================================================
# The Elastic skin posts JSON/multipart blobs that trip 920 anomaly rules
# on overall body size / structure for authenticated XHR requests. Relax
# only the request-body-format checks, not the content-inspection rules.
SecRule REQUEST_HEADERS:X-Requested-With "@streq XMLHttpRequest" \
    "id:9508500,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveById=920470,\
    ctl:ruleRemoveById=200002"
